<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / iOS full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="X-penses" />
    <meta name="theme-color" content="#08090d" />

    <title>X-penses</title>

    <!-- Prevent white flash before React mounts -->
    <style>
      html, body, #root {
        background-color: #08090d;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #111111;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.png" style="width:220px;border-radius:32px;" />
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');
        var hidden = false;
        var startTime = Date.now();
        var MIN_DISPLAY = 1800;
        function hideSplash() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('hide');
          setTimeout(function() { splash.remove(); }, 400);
        }
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            observer.disconnect();
            var elapsed = Date.now() - startTime;
            var remaining = MIN_DISPLAY - elapsed;
            setTimeout(hideSplash, remaining > 0 ? remaining : 0);
          }
        });
        observer.observe(root, { childList: true });
        setTimeout(hideSplash, 4000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
